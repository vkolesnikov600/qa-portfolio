name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-portfolio-deploy
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Express healthcheck
        run: |
          npm start &
          APP_PID=$!
          trap 'kill $APP_PID' EXIT
          sleep 3
          curl --fail http://localhost:3000/health

      - name: Build Docker image
        run: docker build -t qa-portfolio .

      - name: Test Docker container
        run: |
          trap 'docker stop qa-portfolio' EXIT
          docker run -d --name qa-portfolio -p 3000:3000 qa-portfolio
          sleep 3
          curl --fail http://localhost:3000/health

  deploy-pages:
    name: Deploy GitHub Pages
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish public folder to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -R public /tmp/qa-portfolio-public
          git fetch origin gh-pages || true
          git checkout --orphan gh-pages-deploy
          git rm -rf .
          cp -R /tmp/qa-portfolio-public/. .
          touch .nojekyll
          git add .
          git commit -m "Deploy GitHub Pages"
          git push origin gh-pages-deploy:gh-pages --force
